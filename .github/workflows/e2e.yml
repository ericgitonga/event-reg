name: E2E

# Gates a PR on the golden-path E2E suite (e2e/) before it can merge to main. Runs a locally
# built-and-started server in the CI runner, not a live Vercel Preview deployment — avoids
# depending on Vercel's own deployment-webhook timing.
#
# CI runs against its own dedicated Turso database ("event-reg-ci", issue #9) — provisioned via
# the same Vercel Marketplace Turso integration as the app's own database, connected only to the
# unused "development" Vercel environment so it's fully decoupled from Preview/Production.
# Credentials live as repository secrets (TURSO_DATABASE_URL/TURSO_AUTH_TOKEN), not pulled from
# Vercel at all — matches busherian-hike issue #28's precedent, avoiding both a VERCEL_TOKEN
# dependency and any risk of CI ever touching real registrant data. `db/schema.sql` and the seed
# event (`e2e/fixtures/event.json`, id "e2e-fixture") are both applied on every run (schema via
# `db:migrate`, seed via `db:sync-e2e-fixture`'s upsert) rather than as one-time manual setup —
# an edit to the fixture file (e.g. issue #10 adding `config.legal`) would otherwise silently
# drift from what's actually seeded until someone happened to patch the row by hand.

on:
  pull_request:
    branches: [main]

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # --ignore-scripts: blocks a compromised/typosquatted transitive dependency's postinstall
      # hook from running arbitrary code during install, before secrets are written below —
      # same reasoning as busherian-hike issue #26/#28.
      - run: npm ci --ignore-scripts

      - name: Write .env.local from repository secrets
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          cat > .env.local <<EOF
          TURSO_DATABASE_URL=$TURSO_DATABASE_URL
          TURSO_AUTH_TOKEN=$TURSO_AUTH_TOKEN
          ACTIVE_EVENT_SLUG=e2e-fixture
          EOF

      - name: Apply pending migrations
        run: npm run db:migrate

      - name: Sync e2e fixture event
        run: npm run db:sync-e2e-fixture

      - run: npm run build

      - name: Check no secret leaked into the client bundle
        # Cheap, mechanical guard against a future regression (e.g. a server-only module getting
        # imported into a Client Component) — same reasoning as busherian-hike issue #40. -l
        # lists only matching *filenames*, never the matched line/content, so this is safe to
        # print even on a hit; GitHub Actions also automatically masks this secret value anywhere
        # it'd appear in logs, as a second layer. Loops over every secret this job actually has
        # access to (issue #32, Low) rather than a single hardcoded name, so adding a new CI
        # secret here also automatically gets this coverage instead of relying on someone
        # remembering to duplicate the check by hand.
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          leaked=""
          for name in TURSO_DATABASE_URL TURSO_AUTH_TOKEN; do
            value="${!name}"
            if [ -n "$value" ]; then
              matches=$(grep -rlF -e "$value" .next/static || true)
              if [ -n "$matches" ]; then
                leaked="$leaked $name"
              fi
            fi
          done
          if [ -n "$leaked" ]; then
            echo "::error::Secret value(s) found bundled into the client build, for:$leaked"
            exit 1
          fi

      - name: Start server
        # Output redirected to a file: GitHub Actions stops capturing a backgrounded (`&`)
        # process's output once the step that launched it exits. "Print server log" below cats
        # this file so it's visible regardless of outcome.
        run: |
          npm run start > /tmp/server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/api/health > /dev/null && exit 0
            sleep 1
          done
          echo "Server did not become ready in time" >&2
          exit 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Playwright (Python)
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Run E2E suite
        run: python e2e/run.py

      - name: Print server log
        if: always()
        run: cat /tmp/server.log
